<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1008-2 幻灯片</title>
    <style>
        /* 基础重置与字体设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #ffd2d2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 幻灯片容器 */
        .slideshow-container {
            width: 800px;
            max-width: 90%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            height: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 每一张幻灯片 */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: slideAnimation 9s infinite;
        }

        /* 图片区域撑满幻灯片 */
        .slide-image {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slide-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 文字覆盖层：透明黑底 */
        .slide-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            /* 透明黑底：60%不透明度的纯黑遮罩 */
            background: rgba(0, 0, 0, 0.6); 
            padding: 25px 30px;
            
            /* Flex布局：让白字在黑底上方居中排列 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 白字样式 */
        .slide-text h2,
        .slide-text p {
            color: #ffffff; /* 纯白字 */
            text-align: center;
            width: 100%;
        }

        .slide-text h2 {
            margin-bottom: 8px;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .slide-text p {
            font-size: 1rem;
            line-height: 1.5;
            opacity: 0.9;
        }

        /* 核心CSS动画逻辑 */
        @keyframes slideAnimation {
            0%   { opacity: 0; transform: scale(1.05); } 
            2%   { opacity: 1; transform: scale(1); }    
            31%  { opacity: 1; transform: scale(1); }    
            33%  { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 0; transform: scale(0.95); } 
        }

        /* 错开动画延迟 */
        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 3s; }
        .slide:nth-child(3) { animation-delay: 6s; }

        /* 页脚包含指定文字 */
        .footer {
            position: fixed;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #666;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="slideshow-container">
        <!-- 幻灯片 1 -->
        <div class="slide">
            <div class="slide-image">
                <img src="img/1.jpg" alt="幻灯片图片1">
            </div>
            <div class="slide-text">
                <h2>航海家</h2>
                <p>乘风破浪，探索未知的深蓝海域与远方的大陆。</p>
            </div>  
        </div>

        <!-- 幻灯片 2 -->
        <div class="slide">
            <div class="slide-image">
                <img src="img/2.jpg" alt="幻灯片图片2">
            </div>
            <div class="slide-text">
                <h2>跨海大桥</h2>
                <p>宏伟的建筑奇迹，跨越天堑连接彼此的海岸。</p>

            </div>
        </div>

        <!-- 幻灯片 3 -->
        <div class="slide">
            <div class="slide-image">
                <img src="img/3.jpg" alt="幻灯片图片3">
            </div>
            <div class="slide-text">
                <h2>秋日落叶</h2>
                <p>金黄的叶片随风飘落，铺就一条温暖的归家之途。</p>

            </div>
        </div>
    </div>

    <!-- 包含指定文字“徐昕妤” -->
    <div class="footer">
        制作人：徐昕妤
    </div>

</body>
</html>
