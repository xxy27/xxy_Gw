<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型/框模型(box model)</title>
    <style>
        body,h2,ul,li{
            padding: 0;
            margin: 0;
        }
        #a{
            width: 400px;
            height: 400px;
            border:1px solid #039;/*边框*/
            padding: 50px 40px 30px 20px; /*内边框 上右下左 */
            margin: 40px auto;/*外边框 上右下左 水平居中*/
        }
        #b{
            width: 400px;
            height: 400px;
            border:1px solid #039;
            margin: 50px auto 40px;
        }
        /*扩展c和d，边框用dotted，宽度为3px*/
        #c{
            width: 400px;
            height: 400px;
            border:3px dotted #039;
            margin: 50px auto 40px;
        }
        #d{
            width: 400px;
            height: 400px;
            border:3px dotted #039;
            margin: 50px auto 40px;
        }
    </style>
</head>
<body>
    <div id="a">927徐昕妤</div>
    <div id="b">927徐昕妤</div>
    <div id="c">927徐昕妤</div>  
    <div id="d">927徐昕妤</div>
</body>
</html>
