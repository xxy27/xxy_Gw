<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box p {
            color: rgb(214, 214, 255);
            font-size: 50px;
        }
        /*标签选择器*/
        #box{
            width: 600px;
            height: 500px;
            background-color: #3c446e;
        }
        .n1{
            color: rgb(249, 202, 231);
        }
        .n2{
            color: rgb(248, 255, 203);
        }
        .n3{
            color: rgb(203, 255, 255);
        }
    </style>
</head>
<body>
    <h2 style="background-color: black;color: white;">层叠样式表 CSS</h2>
    <div id="box">
        <p >CSS<span style="color: white;">选择器</span></p>
        <p><span class="n1">徐</span><span class="n2">昕</span><span class="n3">妤</span></p>
        <p>CSS属性</p>
    </div>
    <!-- 扩展1：h2黑底白字 -->
    <!-- 扩展2：CSS选择器中选择器三个字是白色 -->
    <!-- 扩展3：新增一个宽300高300的盒子，有背景颜色 -->
    <div style="width: 300px;height: 300px;background-color: #a1affe;"></div>
</body>
</html> 
</html>
