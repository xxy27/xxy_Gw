<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1008-2 幻灯片</title>
    <style>
        /* 基础重置与字体设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 幻灯片外层包裹，用于适应内容高度 */
        .slideshow-wrapper {
            width: 800px;
            max-width: 90%;
        }

        /* 幻灯片图片区域容器 */
        .slideshow-container {
            width: 100%;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            position: relative;
            height: 450px; /* 图片区域固定高度 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* 每一张幻灯片 */
        .slide {
            position: absolute;
            top: 0;
            left: -100%; /* 初始位置在容器左侧外部 */
            width: 100%;
            height: 100%;
            animation: slideAnimation 9s infinite;
            display: flex;
            flex-direction: column; /* 上图下文布局 */
        }

        /* 图片区域 */
        .slide-image {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slide-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 文字区域（纯文本，无黑底遮罩） */
        .slide-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff; /* 白色背景 */
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05); /* 微弱的向上阴影增加层次感 */
        }

        .slide-text h2 {
            color: #333333;
            margin-bottom: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .slide-text p {
            color: #666666;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* 核心CSS动画逻辑：位置滑动 */
        @keyframes slideAnimation {
            0%   { left: -100%; } /* 从左侧滑入准备 */
            2%   { left: 0; }     /* 滑入到中心位置 */
            31%  { left: 0; }     /* 在中心位置停留展示 */
            33%  { left: 100%; }  /* 向右侧滑出 */
            100% { left: 100%; }  /* 保持在右侧等待周期结束 */
        }

        /* 错开动画延迟 */
        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 3s; }
        .slide:nth-child(3) { animation-delay: 6s; }

        /* 页脚包含指定文字 */
        .footer {
            position: fixed;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #888;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="slideshow-wrapper">
        <div class="slideshow-container">
            <!-- 幻灯片 1 -->
            <div class="slide">
                <div class="slide-image">
                    <img src="img/1.jpg" alt="幻灯片图片1">
                </div>
                <div class="slide-text">
                    <h2>航海家</h2>
                    <p>乘风破浪，探索未知的深蓝海域与远方的大陆。</p>
                </div>  
            </div>

            <!-- 幻灯片 2 -->
            <div class="slide">
                <div class="slide-image">
                    <img src="img/2.jpg" alt="幻灯片图片2">
                </div>
                <div class="slide-text">
                    <h2>跨海大桥</h2>
                    <p>宏伟的建筑奇迹，跨越天堑连接彼此的海岸。</p>
                </div>
            </div>

            <!-- 幻灯片 3 -->
            <div class="slide">
                <div class="slide-image">
                    <img src="img/3.jpg" alt="幻灯片图片3">
                </div>
                <div class="slide-text">
                    <h2>秋日落叶</h2>
                    <p>金黄的叶片随风飘落，铺就一条温暖的归家之途。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 包含指定文字“徐昕妤” -->
    <div class="footer">
        制作人：徐昕妤
    </div>

</body>
</html>
