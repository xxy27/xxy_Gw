<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不同的纯 CSS 动画</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .stage {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .name {
            margin: 0;
            color: #fff;
            font-size: 2rem;
            letter-spacing: 0.2em;
            text-align: center;
        }

        .boxes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .box {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #4d96ff);
            background-size: 200% 200%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: colorShift 6s ease-in-out infinite alternate, floatBox 4s ease-in-out infinite;
        }

        .box::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        .box:nth-child(2) {
            animation: colorShift 7s ease-in-out infinite alternate, rotateBox 5s linear infinite;
            border-radius: 50%;
        }

        .box:nth-child(3) {
            animation: pulseGlow 2.8s ease-in-out infinite, floatBox 3.5s ease-in-out infinite alternate;
            border-radius: 18px;
        }

        @keyframes colorShift {
            0% {
                background-position: 0% 50%;
                filter: hue-rotate(0deg);
            }
            50% {
                background-position: 100% 50%;
                filter: hue-rotate(120deg);
            }
            100% {
                background-position: 0% 50%;
                filter: hue-rotate(240deg);
            }
        }

        @keyframes floatBox {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-18px) scale(1.04);
            }
        }

        @keyframes rotateBox {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.08);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 0 rgba(255, 255, 255, 0), 0 12px 28px rgba(0, 0, 0, 0.18);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 24px rgba(77, 150, 255, 0.8), 0 18px 36px rgba(77, 150, 255, 0.35);
                transform: scale(1.08);
            }
        }
    </style>
</head>
<body>
    <main class="stage">
        <h1 class="name">徐昕妤</h1>
        <div class="boxes">
            <div class="box" aria-label="浮动颜色方块"></div>
            <div class="box" aria-label="旋转圆形颜色块"></div>
            <div class="box" aria-label="脉冲发光颜色块"></div>
        </div>
    </main>
</body>
</html>
