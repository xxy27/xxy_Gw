<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1102-3 · 商品列表 · fetch 接口数据</title>
    <!-- 姓名：徐昕妤，建立时间：2026-11-02 13:52，使用大模型：DeepSeek-V4.1-Flash，功能名称：fetch获取商品列表（列表页） -->
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f3f6fb;
            color: #262c38;
            line-height: 1.6;
        }

        .xxy_header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: #fff;
            padding: 20px 16px;
        }
        .xxy_header-inner {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .xxy_brand h1 { font-size: 21px; }
        .xxy_brand p { font-size: 12.5px; opacity: .85; }
        .xxy_back {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            background: rgba(255, 255, 255, .16);
            border-radius: 8px;
            padding: 7px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .xxy_back:hover { background: rgba(255, 255, 255, .28); }

        .xxy_wrap { max-width: 1080px; margin: 0 auto; padding: 22px 16px 50px; }

        .xxy_toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }
        .xxy_btn {
            border: none;
            background: #2563eb;
            color: #fff;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 14px;
            cursor: pointer;
        }
        .xxy_btn:hover { background: #1e3a8a; }
        .xxy_btn:disabled { background: #cfd6e4; cursor: not-allowed; }
        .xxy_btn.xxy_ghost { background: #e0e9ff; color: #1e40af; }
        .xxy_btn.xxy_ghost:hover { background: #c7d8ff; }

        .xxy_status {
            flex: 1;
            min-width: 220px;
            font-size: 13.5px;
            color: #5b6473;
            background: #fff;
            border: 1px dashed #c7d2e6;
            border-radius: 8px;
            padding: 9px 14px;
        }
        .xxy_status.xxy_err { color: #b91c1c; border-color: #fca5a5; background: #fef2f2; }
        .xxy_status.xxy_ok { color: #15803d; border-color: #86efac; background: #f0fdf4; }

        .xxy_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        .xxy_card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 14px rgba(30, 58, 138, .09);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform .16s, box-shadow .16s;
        }
        .xxy_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(30, 58, 138, .16);
        }
        .xxy_thumb {
            height: 168px;
            background: #eef3fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .xxy_thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .xxy_body { padding: 12px 14px 15px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .xxy_tag {
            align-self: flex-start;
            font-size: 11.5px;
            color: #1e40af;
            background: #e8efff;
            border-radius: 20px;
            padding: 2px 9px;
        }
        .xxy_title {
            font-size: 14.5px;
            font-weight: bold;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 44px;
        }
        .xxy_brand-text { font-size: 12px; color: #7b8496; }
        .xxy_foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 6px;
        }
        .xxy_price { color: #e11d48; font-size: 17px; font-weight: bold; }
        .xxy_price small { font-size: 12px; font-weight: normal; }
        .xxy_old { font-size: 12px; color: #9aa3b2; text-decoration: line-through; margin-left: 4px; }
        .xxy_rating { font-size: 12.5px; color: #b45309; }

        /* 加载中的骨架占位 */
        .xxy_skeleton { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 3px 14px rgba(30, 58, 138, .07); }
        .xxy_sk-thumb { height: 168px; background: #eef1f7; }
        .xxy_sk-body { padding: 14px; }
        .xxy_sk-line { height: 12px; border-radius: 6px; background: #eef1f7; margin-bottom: 9px; }
        .xxy_sk-line.xxy_short { width: 45%; }

        .xxy_note {
            margin-top: 22px;
            font-size: 13px;
            color: #1e40af;
            background: #eff4ff;
            border: 1px solid #c7d8ff;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .xxy_note code {
            background: #fff;
            border-radius: 5px;
            padding: 1px 6px;
            font-family: Consolas, monospace;
            font-size: 12.5px;
        }
        .xxy_footer { text-align: center; color: #98a0b3; font-size: 13px; margin-top: 24px; }
    </style>
</head>
<body>
    <header class="xxy_header">
        <div class="xxy_header-inner">
            <div class="xxy_brand">
                <h1>商品列表</h1>
                <p>数据来源：dummyjson.com · 原生 fetch 请求</p>
            </div>
            <a class="xxy_back" href="index.html"><span class="iconfont icon-shouye"></span>返回首页</a>
        </div>
    </header>

    <div class="xxy_wrap">
        <div class="xxy_toolbar">
            <button class="xxy_btn" id="xxy_reload_btn">刷新列表</button>
            <div class="xxy_status" id="xxy_status">正在加载商品列表……</div>
        </div>

        <div class="xxy_grid" id="xxy_grid"></div>

        <div class="xxy_note">
            列表接口：<code>GET https://dummyjson.com/products?limit=8</code>，返回 JSON 中的 <code>products</code> 数组；
            点击任意商品卡片，会跳转到 <code>1102-3-detail.html?id=商品ID</code>，由详情页再根据 ID 单独请求详情接口。
        </div>

        <p class="xxy_footer">1102-3 · 商品列表页 · 徐昕妤</p>
    </div>

    <script>
        var xxy_list_url = "https://dummyjson.com/products?limit=8";
        var xxy_grid = document.getElementById("xxy_grid");
        var xxy_status = document.getElementById("xxy_status");
        var xxy_reload_btn = document.getElementById("xxy_reload_btn");

        // 设置状态栏文字与样式：xxy_type 取 "normal" / "err" / "ok"
        function xxy_set_status(xxy_text, xxy_type) {
            xxy_status.textContent = xxy_text;
            var xxy_class = "xxy_status";
            if (xxy_type === "err") { xxy_class += " xxy_err"; }
            if (xxy_type === "ok") { xxy_class += " xxy_ok"; }
            xxy_status.className = xxy_class;
        }

        // 渲染 8 个骨架占位卡片，等接口返回前先撑起版面
        function xxy_render_skeleton() {
            var xxy_html = "";
            for (var xxy_i = 0; xxy_i < 8; xxy_i++) {
                xxy_html += '<div class="xxy_skeleton">'
                    + '<div class="xxy_sk-thumb"></div>'
                    + '<div class="xxy_sk-body">'
                    + '<div class="xxy_sk-line xxy_short"></div>'
                    + '<div class="xxy_sk-line"></div>'
                    + '<div class="xxy_sk-line xxy_short"></div>'
                    + '</div></div>';
            }
            xxy_grid.innerHTML = xxy_html;
        }

        // 请求列表接口并渲染商品卡片
        async function xxy_load_list() {
            xxy_reload_btn.disabled = true;
            xxy_render_skeleton();
            xxy_set_status("正在加载商品列表……", "normal");
            try {
                var xxy_res = await fetch(xxy_list_url);
                if (!xxy_res.ok) {
                    throw new Error("HTTP 状态码 " + xxy_res.status);
                }
                var xxy_data = await xxy_res.json();
                xxy_render_cards(xxy_data.products);
                xxy_set_status("加载成功：共 " + xxy_data.products.length + " 件商品", "ok");
            } catch (xxy_e) {
                xxy_grid.innerHTML = "";
                xxy_set_status("加载失败：" + xxy_e.message + "，请检查网络后点击刷新", "err");
            }
            xxy_reload_btn.disabled = false;
        }

        // 根据商品数组生成卡片，卡片整体即链接，跳转详情页
        function xxy_render_cards(xxy_products) {
            var xxy_html = "";
            for (var xxy_i = 0; xxy_i < xxy_products.length; xxy_i++) {
                var xxy_p = xxy_products[xxy_i];
                // 原价 = 现价 / (1 - 折扣百分比/100)
                var xxy_old_price = (xxy_p.price / (1 - xxy_p.discountPercentage / 100)).toFixed(2);
                xxy_html += '<a class="xxy_card" href="1102-3-detail.html?id=' + xxy_p.id + '">'
                    + '<div class="xxy_thumb"><img src="' + xxy_p.thumbnail + '" alt="' + xxy_p.title + '" loading="lazy"></div>'
                    + '<div class="xxy_body">'
                    + '<span class="xxy_tag">' + xxy_p.category + '</span>'
                    + '<div class="xxy_title">' + xxy_p.title + '</div>'
                    + '<div class="xxy_brand-text">' + xxy_p.brand + '</div>'
                    + '<div class="xxy_foot">'
                    + '<span class="xxy_price"><small>$</small>' + xxy_p.price
                    + '<span class="xxy_old">$' + xxy_old_price + '</span></span>'
                    + '<span class="xxy_rating">★ ' + xxy_p.rating + '</span>'
                    + '</div></div></a>';
            }
            xxy_grid.innerHTML = xxy_html;
        }

        xxy_reload_btn.addEventListener("click", xxy_load_list);

        // 页面打开即请求一次
        xxy_load_list();
    </script>
</body>
</html>
