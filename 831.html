<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>927 徐昕妤</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 600px;
            animation: slideIn 0.8s ease-out;
        }

        .number {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .name {
            font-size: 2.5rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        .description {
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .footer {
            font-size: 0.9rem;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 30px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .number {
                font-size: 2.5rem;
            }

            .name {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="number">927</div>
        <div class="name">徐昕妤</div>
        <div class="divider"></div>
        <div class="description">
            欢迎来到我的页面
        </div>
        <div class="footer">
            © 2026 All rights reserved
        </div>
    </div>
</body>
</html>
