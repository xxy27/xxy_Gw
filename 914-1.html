<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: rgb(214, 214, 255);
            font-size: 100px;
        }
        .text{
            color: rgb(203, 250, 234);
        }
        #text{
            color: rgb(128, 10, 10);
        }
        #box #text{
            color: rgb(255, 184, 137);
        }
        .text{
            color: rgb(250, 249, 145)!important;
            /* !important 优先级最高，覆盖所有样式 */
        }
        /*选择器优先：id选择器>class选择器>标签选择器*/
        #box{
            width: 600px;
            height: 300px;
            background-color: #3c446e;
            margin: 10px;
            padding: 10px;
            letter-spacing: 5px;
        }
    </style>
    <link rel="stylesheet" href="css.css">
    <!-- 后定义的覆盖前定义的样式 -->
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box">
        <p id="text" class="text">927徐昕妤</p>
        <p>层叠与继承的优先级</p>
    </div>
</body>
</html>
